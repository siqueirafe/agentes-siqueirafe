<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}}</title>
  <style>
    :root { color-scheme: light dark; --papel: #ffffff; --fundo: #f4f5f7; --tinta: #2b2b2b; --tinta-2: #4a4a4a; --apagado: #6b6b6b; --linha: #e3e3e3; --laranja: #ec7000; --laranja-link: #c75f00; --laranja-claro: #fff1e3; --azul: #003a70; --azul-titulo: #003a70; --sobre-laranja: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --papel: #151b23; --fundo: #0f141a; --tinta: #eef1f5; --tinta-2: #c9d0d9; --apagado: #98a2ae; --linha: #2a3440; --laranja: #d96800; --laranja-link: #ff9a3d; --laranja-claro: #2a1e12; --azul: #0e4c8a; --azul-titulo: #9cc3ee; --sobre-laranja: #ffffff; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: Arial, "Segoe UI", Helvetica, sans-serif; font-size: 17px; line-height: 1.55; }
    .topo { background: var(--laranja); color: var(--sobre-laranja); }
    .topo-dentro { max-width: 720px; margin: 0 auto; padding: 28px 20px 22px; }
    .selo { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin: 0 0 8px; opacity: .92; }
    h1 { font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 0 0 6px; }
    .data { margin: 0; font-size: 15px; }
    main { max-width: 720px; margin: 0 auto; padding: 0 20px 56px; background: var(--papel); }
    article { padding-top: 1px; }
    .primeira { background: var(--azul); color: #ffffff; font-size: 19px; line-height: 1.45; padding: 16px 18px; border-left: 6px solid var(--laranja); margin: 0 -20px 24px; }
    article h2 { color: var(--azul-titulo); font-weight: 700; font-size: 20px; margin: 26px 0 6px; line-height: 1.25; }
    article h3 { color: var(--azul-titulo); font-size: 17px; margin: 20px 0 6px; }
    article p { margin: 0 0 12px; color: var(--tinta-2); }
    article a { color: var(--laranja-link); font-weight: 700; text-decoration: none; }
    article a:hover { text-decoration: underline; }
    .time { background: var(--laranja-claro); border-top: 5px solid var(--laranja); padding: 4px 18px 10px; margin: 32px -20px 0; }
    .time > h2 { display: inline-block; background: var(--azul); color: #ffffff; font-size: 15px; letter-spacing: .05em; padding: 6px 12px; margin: 18px 0 8px; }
    .anteriores { margin-top: 40px; padding-top: 18px; border-top: 3px solid var(--laranja); }
    .anteriores h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--apagado); margin: 0 0 10px; }
    .anteriores ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
    .anteriores a { color: var(--laranja-link); font-weight: 700; text-decoration: none; }
    footer { margin-top: 40px; color: var(--apagado); font-size: 13px; border-top: 1px solid var(--linha); padding-top: 14px; }
  </style>
</head>
<body>
  <header class="topo">
    <div class="topo-dentro">
      <p class="selo">O radar de hoje</p>
      <h1>{{TITULO}}</h1>
      <p class="data">{{DATA}}</p>
    </div>
  </header>
  <main>
    <article>
{{BRIEFING}}
    </article>
    <section class="anteriores">
      <h2>Dias anteriores</h2>
      <ul>
{{ANTERIORES}}
      </ul>
    </section>
    <footer>Feito na Formação Claude, do Chat ao Code. Um time de agentes pesquisa, confere e escreve; toda afirmação tem fonte; só os destinatários da rotina recebem uma cópia por e-mail.</footer>
  </main>
</body>
</html>
